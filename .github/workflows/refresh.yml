name: Refresh profile SVGs

# Re-renders the hero + activity card. Daily for fresh stats, on demand from
# the Actions tab, and whenever the scripts change.
"on":
  schedule:
    - cron: "23 21 * * *"   # 05:23 SGT
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/refresh.yml"]

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - name: Fetch contributions + languages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: python scripts/fetch_stats.py

      - name: Render SVGs
        run: |
          python scripts/render_hero.py
          python scripts/render_activity.py

      - name: Commit if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh profile svgs [skip ci]"
          file_pattern: "assets/*.svg data/stats.json"

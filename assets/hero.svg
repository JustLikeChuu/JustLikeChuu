    <g class="ln" style="animation-delay:2.39s"><text x="352" y="178" textLength="26.1" lengthAdjust="spacingAndGlyphs" fill="#ff4d3d" font-weight="700">[+]</text><text x="386.8" y="178" textLength="391.5" lengthAdjust="spacingAndGlyphs" fill="#ffd27a">targeting&#160;&#160;&#160;penetration&#160;testing&#160;/&#160;red&#160;teaming</text></g>
    <g class="ln" style="animation-delay:2.48s"><text x="352" y="203" textLength="26.1" lengthAdjust="spacingAndGlyphs" fill="#ff4d3d" font-weight="700">[+]</text><text x="386.8" y="203" textLength="417.6" lengthAdjust="spacingAndGlyphs" fill="#ffd27a">building&#160;&#160;&#160;&#160;secure&#160;FTP&#160;&amp;&#160;multiplayer&#160;Tetris&#160;in&#160;C</text></g>
